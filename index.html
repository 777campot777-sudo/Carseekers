<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carseekers — Подбор и расчет стоимости авто из США</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-lg font-bold text-xl tracking-wider">CS</div>
                <span class="text-xl font-extrabold tracking-tight text-white">Carseekers</span>
            </div>
            <nav class="flex space-x-1 sm:space-x-4">
                <button onclick="switchTab('search')" id="tab-search" class="px-3 py-2 rounded-md text-sm font-medium transition-colors bg-brand-600 text-white">Поиск лотов</button>
                <button onclick="switchTab('calculator')" id="tab-calculator" class="px-3 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-white hover:bg-slate-700">Калькулятор растаможки</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <!-- SEARCH TAB -->
        <section id="section-search" class="space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h1 class="text-2xl font-bold mb-4 text-white">Каталог лотов из США</h1>
                
                <!-- Filters -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Марка</label>
                        <select id="filter-make" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                            <option value="">Все марки</option>
                            <option value="BMW">BMW</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Аукцион</label>
                        <select id="filter-auction" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                            <option value="">Все аукционы</option>
                            <option value="copart">Copart</option>
                            <option value="iaai">IAAI</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Тип документа</label>
                        <select id="filter-doc" onchange="applyFilters()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                            <option value="">Любые документы</option>
                            <option value="Salvage">Salvage</option>
                            <option value="Clean Title">Clean Title</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Макс. цена ($)</label>
                        <input type="number" id="filter-max-price" placeholder="Например, 15000" oninput="applyFilters()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                    </div>
                </div>
            </div>

            <!-- Cars Grid -->
            <div id="cars-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Динамически заполняется скриптом -->
            </div>
        </section>

        <!-- CALCULATOR TAB -->
        <section id="section-calculator" class="hidden space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg max-w-2xl mx-auto">
                <h1 class="text-2xl font-bold mb-6 text-white">Калькулятор логистики и растаможки</h1>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Стоимость лота на аукционе ($)</label>
                        <input type="number" id="calc-price" value="10000" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Объем двигателя (см³)</label>
                        <input type="number" id="calc-engine" value="2000" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Возраст автомобиля (лет)</label>
                        <input type="number" id="calc-age" value="5" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
                    </div>

                    <div class="pt-4 border-t border-slate-700 space-y-2">
                        <div class="flex justify-between text-sm text-slate-400">
                            <span>Аукционный сбор (примерно):</span>
                            <span id="res-auction-fee" class="text-white font-medium">$700</span>
                        </div>
                        <div class="flex justify-between text-sm text-slate-400">
                            <span>Доставка по США и морем:</span>
                            <span id="res-shipping" class="text-white font-medium">$1,800</span>
                        </div>
                        <div class="flex justify-between text-sm text-slate-400">
                            <span>Таможенные платежи:</span>
                            <span id="res-customs" class="text-white font-medium">$2,500</span>
                        </div>
                        <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-slate-700">
                            <span>Итого под ключ:</span>
                            <span id="res-total" class="text-brand-500">$15,000</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 mt-auto text-center text-xs text-slate-500">
        Carseekers Platform &copy; 2026. Все права защищены.
    </footer>

    <!-- Script Logic -->
    <script>
        // Интегрированный Project URL из панели Supabase
        const SUPABASE_URL = 'https://vlkbmqwnisxmhdbtdeyf.supabase.co';
        
        // Безопасный публичный ключ (Publishable key)
        const SUPABASE_ANON_KEY = 'sb_publishable_me8C_wm6h9FPtTaltjvV_Q_7jXes'; 
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Ошибка инициализации Supabase клиента:', e);
        }

        // Хранилище лотов
        let sampleCars = [];

        // Переключение вкладок
        function switchTab(tabId) {
            document.getElementById('section-search').classList.add('hidden');
            document.getElementById('section-calculator').classList.add('hidden');
            
            document.getElementById('tab-search').className = 'px-3 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-white hover:bg-slate-700';
            document.getElementById('tab-calculator').className = 'px-3 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-white hover:bg-slate-700';

            document.getElementById('section-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).className = 'px-3 py-2 rounded-md text-sm font-medium transition-colors bg-brand-600 text-white';
        }

        // Загрузка лотов из Supabase
        async function fetchCarsFromSupabase() {
            if (!supabaseClient) {
                loadFallbackCars();
                return;
            }

            try {
                const { data, error } = await supabaseClient.from('cars').select('*');
                if (error) throw error;
                
                if (data && data.length > 0) {
                    sampleCars = data;
                } else {
                    loadFallbackCars();
                }
            } catch (err) {
                console.error('Ошибка загрузки из Supabase:', err);
                loadFallbackCars();
            }
            applyFilters();
        }

        // Резервные данные, если база пуста или таблица еще не создана
        function loadFallbackCars() {
            sampleCars = [
                { id: 1, make: 'BMW', model: 'BMW 530e xDrive Hybrid', year: 2018, price: 11500, mileage: 68000, doc: 'Salvage', damage: 'Front End', key: 'yes', auction: 'copart', lot: '48291024' },
                { id: 2, make: 'BMW', model: 'BMW 430i Gran Coupe', year: 2020, price: 14200, mileage: 45000, doc: 'Clean Title', damage: 'Side', key: 'yes', auction: 'iaai', lot: '91823741' }
            ];
        }

        // Применение фильтров и рендеринг карточек
        function applyFilters() {
            const make = document.getElementById('filter-make').value;
            const auction = document.getElementById('filter-auction').value;
            const doc = document.getElementById('filter-doc').value;
            const maxPrice = parseFloat(document.getElementById('filter-max-price').value) || Infinity;

            const filtered = sampleCars.filter(car => {
                if (make && car.make !== make) return false;
                if (auction && car.auction !== auction) return false;
                if (doc && car.doc !== doc) return false;
                if (car.price > maxPrice) return false;
                return true;
            });

            renderCars(filtered);
        }

        // Отрисовка карточек машин
        function renderCars(cars) {
            const grid = document.getElementById('cars-grid');
            grid.innerHTML = '';

            if (cars.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Лоты не найдены</div>`;
                return;
            }

            cars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md hover:border-brand-500 transition-colors flex flex-col justify-between';
                card.innerHTML = `
                    <div class="p-5 space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="text-xs uppercase font-bold tracking-wider px-2 py-1 bg-brand-600/20 text-brand-400 rounded">${car.auction || 'auction'}</span>
                            <span class="text-xs font-mono text-slate-400">Lot: ${car.lot || 'N/A'}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white">${car.year} ${car.model}</h3>
                        <div class="grid grid-cols-2 gap-2 text-sm text-slate-300 pt-2 border-t border-slate-700/60">
                            <div>Пробег: <span class="text-white font-medium">${car.mileage ? car.mileage.toLocaleString() + ' mi' : 'N/A'}</span></div>
                            <div>Документ: <span class="text-white font-medium">${car.doc || 'N/A'}</span></div>
                            <div>Повреждение: <span class="text-white font-medium">${car.damage || 'N/A'}</span></div>
                            <div>Ключ: <span class="text-white font-medium">${car.key === 'yes' ? 'Есть' : 'Нет'}</span></div>
                        </div>
                    </div>
                    <div class="bg-slate-900/50 p-4 border-t border-slate-700 flex items-center justify-between">
                        <div>
                            <span class="text-xs text-slate-400 block">Ставка / Цена</span>
                            <span class="text-xl font-extrabold text-white">$${car.price ? car.price.toLocaleString() : '0'}</span>
                        </div>
                        <button onclick="alert('Переход к деталям лота ${car.lot}')" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">Подробнее</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Расчет в калькуляторе
        function calculate() {
            const price = parseFloat(document.getElementById('calc-price').value) || 0;
            const engine = parseFloat(document.getElementById('calc-engine').value) || 2000;
            const age = parseFloat(document.getElementById('calc-age').value) || 5;

            const auctionFee = 700;
            const shipping = 1800;
            const customs = engine * age * 0.4 + (price * 0.1);

            const total = price + auctionFee + shipping + customs;

            document.getElementById('res-auction-fee').innerText = '$' + auctionFee.toLocaleString();
            document.getElementById('res-shipping').innerText = '$' + shipping.toLocaleString();
            document.getElementById('res-customs').innerText = '$' + Math.round(customs).toLocaleString();
            document.getElementById('res-total').innerText = '$' + Math.round(total).toLocaleString();
        }

        // Инициализация при загрузке страницы
        window.onload = function() {
            fetchCarsFromSupabase();
            calculate();
        };
    </script>
</body>
</html>
